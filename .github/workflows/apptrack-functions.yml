name: AppTrack Functions to Azure CD pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  FUNCTION_APP_NAME: func-apptrack-prod
  DOTNET_CORE_VERSION: 10.0.x
  WORKING_DIRECTORY: AppTrack.Functions

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.WORKING_DIRECTORY }}"

      - name: Publish
        run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration Release --no-restore --output publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions
          path: publish

  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: functions
          path: publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.FUNC_APPTRACK_CLIENT_ID }}
          tenant-id: ${{ vars.FUNC_APPTRACK_TENANT_ID }}
          subscription-id: ${{ vars.FUNC_APPTRACK_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: publish
